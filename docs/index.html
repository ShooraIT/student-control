<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация на рабочем месте</title>
<style>
  :root { --bg:#f3f5f9; --card:#fff; --text:#1c2330; --muted:#677185; --line:#d8dde7;
          --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border-radius:16px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  h1 { font-size:20px; margin:0 0 4px; }
  .seat { font-size:44px; font-weight:800; color:var(--accent); line-height:1.1; margin:8px 0 16px; }
  .seat small { display:block; font-size:14px; color:var(--muted); font-weight:500; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input, select, textarea { width:100%; font:inherit; padding:12px; border:1px solid var(--line);
         border-radius:10px; background:#fff; color:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .states { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .states input { display:none; }
  .states label { margin:0; padding:14px 10px; text-align:center; border:2px solid var(--line);
         border-radius:12px; cursor:pointer; font-weight:600; }
  #st-ok:checked + label { border-color:var(--ok); background:#ecfdf3; color:var(--ok); }
  #st-problem:checked + label { border-color:var(--bad); background:#fef2f2; color:var(--bad); }
  button { width:100%; margin-top:20px; padding:14px; font:inherit; font-weight:700; color:#fff;
         background:var(--accent); border:0; border-radius:12px; cursor:pointer; }
  button:disabled { opacity:.6; }
  .err { color:var(--bad); margin-top:12px; }
  .hint { color:var(--muted); font-size:14px; }
  .done { text-align:center; padding:30px 10px; }
  .done .big { font-size:60px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <div class="card" id="formCard">
    <h1>Регистрация на рабочем месте</h1>
    <div class="hint" id="room"></div>
    <div class="seat" id="seatBox" hidden></div>

    <form id="f" novalidate>
      <div id="pcPick" hidden>
        <label for="pc">Номер рабочего места</label>
        <select id="pc" name="pc"></select>
      </div>

      <label for="fio">ФИО студента</label>
      <input id="fio" name="fio" maxlength="100" autocomplete="name" placeholder="Иванов Иван Иванович" required>

      <label for="grp">Группа</label>
      <input id="grp" name="grp" maxlength="30" placeholder="Например, ИСП-21" required>

      <label for="pair">Пара</label>
      <select id="pair" name="pair" required></select>

      <label>Состояние компьютера</label>
      <div class="states">
        <input type="radio" name="state" id="st-ok" value="ok">
        <label for="st-ok">✅ Всё работает</label>
        <input type="radio" name="state" id="st-problem" value="problem">
        <label for="st-problem">⚠️ Есть проблемы</label>
      </div>

      <label for="comment">Комментарий <span class="hint" id="cHint">(необязательно)</span></label>
      <textarea id="comment" name="comment" maxlength="300" placeholder="Что не работает: не включается монитор, нет интернета, не запускается программа…"></textarea>

      <button id="send" type="submit">Отправить</button>
      <div class="err" id="err" hidden></div>
    </form>
  </div>

  <div class="card done" id="doneCard" hidden>
    <div class="big">✅</div>
    <h1>Вы зарегистрированы</h1>
    <p class="hint" id="doneText"></p>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

const toMin = s => { const [h, mm] = s.split(":").map(Number); return h * 60 + mm; };

// Пары на сегодня: понедельник — свой график, вторник–суббота (и воскресенье) — общий
function todayPairs(schedule) {
  const day = schedule.days[new Date().getDay() === 1 ? "mon" : "tue_sat"];
  return schedule.pairs.filter(p => day[p.id]).map(p => ({ ...p, periods: day[p.id],
    start: toMin(day[p.id][0][0]), end: toMin(day[p.id][day[p.id].length - 1][1]) }));
}

// Текущая пара (если идут две — та, что началась позже), иначе ближайшая следующая
function currentPair(pairs) {
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  const now = pairs.filter(p => p.start <= m && m <= p.end).sort((a, b) => b.start - a.start);
  if (now.length) return now[0].id;
  const next = pairs.filter(p => p.start > m).sort((a, b) => a.start - b.start);
  return (next[0] || pairs[pairs.length - 1]).id;
}

// public.json: рассадка, звонки, канал ретранслятора и ОТКРЫТЫЙ ключ преподавателя.
// На компьютере преподавателя сервер добавляет "local": true — тогда отправка идёт напрямую.
let cfg = null;
fetch("public.json", { cache: "no-store" }).then(r => r.json()).then(c => {
  cfg = c;
  $("room").textContent = cfg.room;
  const pc = parseInt(params.get("pc"), 10);
  const pos = cfg.seats[pc];
  if (pos) {
    $("seatBox").hidden = false;
    $("seatBox").innerHTML = `<small>Рабочее место · ряд ${pos.row}, ${pos.place}-е от преподавателя</small>№ ${pc}`;
    $("pc").innerHTML = `<option value="${pc}">${pc}</option>`;
  } else {
    $("pcPick").hidden = false;
    $("pc").innerHTML = `<option value="">— выберите —</option>` +
      Object.entries(cfg.seats).sort((a, b) => a[0] - b[0]).map(([n, p]) =>
        `<option value="${n}">№ ${n} (ряд ${p.row}, место ${p.place})</option>`).join("");
  }
  const pairs = todayPairs(cfg.schedule);
  $("pair").innerHTML = ["I", "II"].map(sh => `<optgroup label="${sh} смена">` +
    pairs.filter(p => p.shift === sh).map(p =>
      `<option value="${p.id}">${p.name} · ${p.periods.map(t => t.join("–")).join(", ")}</option>`).join("") +
    `</optgroup>`).join("");
  $("pair").value = currentPair(pairs);
}).catch(() => { $("err").textContent = "Не удалось загрузить форму, обновите страницу"; $("err").hidden = false; });

// Шифрование анкеты открытым ключом преподавателя (RSA-OAEP, SHA-256), блоками по 190 байт.
// Расшифровать может только программа на компьютере преподавателя.
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function encryptPayload(obj) {
  const key = await crypto.subtle.importKey("jwk", cfg.public_key,
    { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  const parts = [];
  for (let i = 0; i < bytes.length; i += 190)
    parts.push(b64(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, key, bytes.slice(i, i + 190))));
  return "v1." + parts.join(".");
}

async function sendOnline(fd) {
  const body = await encryptPayload(fd);
  const r = await fetch(`${cfg.relay}/${cfg.topic}`, { method: "POST", body });
  if (!r.ok) throw new Error(r.status === 429 ? "Слишком много отправок, попробуйте через минуту" : "Ошибка отправки");
}

async function sendLocal(fd) {
  const r = await fetch("/api/register", { method: "POST",
    headers: {"Content-Type": "application/json"}, body: JSON.stringify(fd) });
  const res = await r.json();
  if (!r.ok) throw new Error(res.error || "Ошибка отправки");
}

function validate(fd) {
  const errs = [];
  if (!fd.pc) errs.push("выберите рабочее место");
  if ((fd.fio || "").trim().length < 3) errs.push("укажите ФИО");
  if (!(fd.grp || "").trim()) errs.push("укажите группу");
  if (!fd.state) errs.push("отметьте состояние компьютера");
  if (fd.state === "problem" && !(fd.comment || "").trim()) errs.push("опишите проблему в комментарии");
  return errs.length ? "Пожалуйста, " + errs.join(", ") : "";
}

$("fio").value = store.get("fio");
$("grp").value = store.get("grp");

document.querySelectorAll('input[name=state]').forEach(r => r.addEventListener("change", () => {
  const problem = $("st-problem").checked;
  $("cHint").textContent = problem ? "(обязательно — опишите проблему)" : "(необязательно)";
  if (problem) $("comment").focus();
}));

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const fd = Object.fromEntries(new FormData($("f")));
  $("err").hidden = true;
  const problem = validate(fd);
  if (problem || !cfg) { $("err").textContent = problem || "Форма ещё загружается"; $("err").hidden = false; return; }
  $("send").disabled = true;
  try {
    await (cfg.local ? sendLocal(fd) : sendOnline(fd));
    store.set("fio", fd.fio); store.set("grp", fd.grp);
    $("formCard").hidden = true; $("doneCard").hidden = false;
    $("doneText").textContent = `Рабочее место № ${fd.pc}, ${$("pair").selectedOptions[0].parentNode.label}, ${$("pair").selectedOptions[0].text.split(" · ")[0]}. ` +
      (fd.state === "problem" ? "Сообщение о проблеме отправлено преподавателю." : "Хорошей работы!");
  } catch (ex) {
    $("err").textContent = ex.message === "Failed to fetch" ? "Нет интернета — проверьте связь и отправьте ещё раз" : ex.message;
    $("err").hidden = false;
  } finally { $("send").disabled = false; }
});
</script>
</body>
</html>
