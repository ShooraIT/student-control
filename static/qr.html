<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-коды рабочих мест</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin:0; padding:16px; color:#1c2330; background:#fff;
         font:14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
  .bar input { font:inherit; padding:8px; min-width:260px; border:1px solid #ccd; border-radius:8px; }
  .bar button { font:inherit; padding:8px 14px; border-radius:8px; border:0; background:#2563eb; color:#fff; cursor:pointer; }
  #cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .card { display:block; color:inherit; text-decoration:none; border:2px dashed #aab; border-radius:12px; padding:12px; text-align:center; break-inside:avoid; }
  .card .n { font-size:34px; font-weight:800; }
  .card .t { font-size:12px; color:#556; margin-bottom:6px; }
  .card .q { display:flex; justify-content:center; }
  .card .u { font-size:10px; color:#778; margin-top:6px; word-break:break-all; }
  @media print { .bar { display:none; } body { padding:0; } #cards { grid-template-columns:repeat(4, 1fr); } }
</style>
</head>
<body>
<div class="bar">
  <b>Адрес формы для QR:</b>
  <input id="base">
  <button id="apply">Обновить</button>
  <button onclick="print()">Печать</button>
  <span style="color:#667">Наклейте каждый код на своё рабочее место. Форма открывается с мобильного интернета; анкеты приходят на этот компьютер, пока запущен сервер.</span>
</div>
<div id="cards"></div>
<script>
const $ = id => document.getElementById(id);
let info;
function draw() {
  const base = $("base").value.trim();
  $("cards").innerHTML = "";
  const seats = Object.entries(info.seats).sort((a, b) => a[0] - b[0]);
  for (const [i, p] of seats) {
    const url = `${base}${base.includes("?") ? "&" : "?"}pc=${i}`;
    const c = document.createElement("a");  // по карточке можно кликнуть и проверить форму
    c.className = "card"; c.href = url; c.target = "_blank"; c.title = "Открыть форму этого места";
    c.innerHTML = `<div class="n">№ ${i}</div><div class="t">Ряд ${p.row}, место ${p.place}<br>Отсканируйте и зарегистрируйтесь</div><div class="q"></div><div class="u"></div>`;
    c.querySelector(".u").textContent = url;
    $("cards").appendChild(c);
    if (window.QRCode) new QRCode(c.querySelector(".q"), { text: url, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
    else c.querySelector(".q").textContent = "(нет интернета для генерации QR — используйте ссылку ниже)";
  }
}
fetch("/api/qrinfo").then(r => r.json()).then(d => { info = d; $("base").value = d.form_url; draw(); });
$("apply").onclick = draw;
</script>
</body>
</html>
