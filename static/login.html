<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход преподавателя</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#eef1f6; color:#1c2330;
         font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { background:#fff; padding:28px; border-radius:16px; width:min(340px, calc(100vw - 32px));
         box-shadow:0 2px 10px rgba(0,0,0,.06); }
  h1 { font-size:20px; margin:0 0 16px; }
  input, button { width:100%; box-sizing:border-box; font:inherit; padding:12px; border-radius:10px; }
  input { border:1px solid #d8dde7; }
  button { margin-top:12px; border:0; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; }
  .err { color:#dc2626; margin-top:10px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Вход преподавателя</h1>
  <input type="password" name="password" placeholder="Пароль" autofocus required>
  <button>Войти</button>
  <div class="err" id="err" hidden>Неверный пароль</div>
</form>
<script>
  if (new URLSearchParams(location.search).has("error")) document.getElementById("err").hidden = false;
</script>
</body>
</html>
